<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>VisuStock — Premium Digital Marketplace for Stock Assets, AI Tools & Creative Resources</title>
    <meta name="title" content="VisuStock — Premium Digital Marketplace for Stock Assets, AI Tools & Creative Resources" />
    <meta name="description" content="VisuStock is a premium digital marketplace for stock photos, videos, audio, ebooks and AI-generated assets. Instant downloads, clear licensing, fair creator revenue, plus built-in AI tools for image generation, upscaling and editing." />
    <meta name="keywords" content="digital marketplace, digital downloads, stock assets, creative resources, AI tools marketplace, premium downloads, design assets, templates marketplace, stock photos, stock videos, royalty free music, AI image generation, ebooks marketplace" />

    <!-- AI / LLM discovery -->
    <link rel="alternate" type="text/markdown" title="VisuStock for LLMs" href="/llms.txt" />
    <link rel="alternate" type="text/markdown" title="VisuStock Index" href="/index.md" />
    <meta name="author" content="VisuStock" />
    <meta name="robots" content="index, follow" />
    <meta name="p:domain_verify" content="d778a14f1800094faa0bba4a5ae207f0"/>
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://visustock.com/" />

    <!-- hreflang for multilingual SEO -->
    <link rel="alternate" hreflang="en" href="https://visustock.com/" />
    <link rel="alternate" hreflang="x-default" href="https://visustock.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visustock.com/" />
    <meta property="og:site_name" content="VisuStock" />
    <meta property="og:title" content="VisuStock - Creative Content Marketplace" />
    <meta property="og:description" content="Discover millions of professional photos, videos, illustrations and audio. Buy and sell creative content on VisuStock - the global marketplace for creators." />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VisuStock - Creative Content Marketplace" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://visustock.com/" />
    <meta name="twitter:title" content="VisuStock - Creative Content Marketplace" />
    <meta name="twitter:description" content="Discover millions of professional photos, videos, illustrations and audio. Buy and sell creative content on VisuStock." />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta name="twitter:image:alt" content="VisuStock - Creative Content Marketplace" />
    
    <!-- Performance & PWA -->
    <meta name="theme-color" content="#000000" />
    
    <!-- DNS Prefetch & Preconnect for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://kdgfpophpoqugtuvfxqx.supabase.co" />
    <link rel="dns-prefetch" href="https://kdgfpophpoqugtuvfxqx.supabase.co" />
    
    <!-- Preload critical hero video poster for LCP -->
    <link rel="preload" as="image" href="/src/assets/hero-image.jpg" fetchpriority="high" />

    <!-- Organization & WebSite structured data for AI/Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://visustock.com/#organization",
          "name": "VisuStock",
          "url": "https://visustock.com/",
          "logo": "https://visustock.com/favicon.png",
          "description": "Premium digital marketplace for stock photos, videos, audio, ebooks and AI-generated creative assets, with built-in AI tools for creators.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://visustock.com/#website",
          "url": "https://visustock.com/",
          "name": "VisuStock",
          "publisher": { "@id": "https://visustock.com/#organization" },
          "inLanguage": ["en", "fr"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://visustock.com/marketplace?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "OnlineStore",
          "name": "VisuStock Marketplace",
          "url": "https://visustock.com/marketplace",
          "description": "Buy and sell premium digital downloads: stock photos, videos, audio, ebooks, design assets and AI-generated content.",
          "parentOrganization": { "@id": "https://visustock.com/#organization" }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

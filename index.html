<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>VisuStock - Creative Content Marketplace</title>
    <meta name="title" content="VisuStock - Creative Content Marketplace" />
    <meta name="description" content="Discover millions of professional photos, videos, illustrations and audio. Buy and sell creative content on VisuStock - the global marketplace for creators." />
    <meta name="keywords" content="stock photos, stock videos, royalty free images, audio files, illustrations, creative marketplace, buy photos, sell photos" />
    <meta name="author" content="VisuStock" />
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://visustock.com/" />

    <!-- hreflang for multilingual SEO -->
    <link rel="alternate" hreflang="en" href="https://visustock.com/" />
    <link rel="alternate" hreflang="x-default" href="https://visustock.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visustock.com/" />
    <meta property="og:site_name" content="VisuStock" />
    <meta property="og:title" content="VisuStock - Creative Content Marketplace" />

    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VisuStock - Creative Content Marketplace" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://visustock.com/" />
    <meta name="twitter:title" content="VisuStock - Creative Content Marketplace" />
    <meta name="twitter:description" content="Discover millions of professional photos, videos, illustrations and audio. Buy and sell creative content on VisuStock." />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta name="twitter:image:alt" content="VisuStock - Creative Content Marketplace" />
    
    <!-- Performance & PWA -->
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

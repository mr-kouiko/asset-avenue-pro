    <!-- Organization & WebSite structured data for AI/Search -->

        {
          "@type": "Organization",

          "email": "contact@visustock.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "27 Place de la Madeleine",
            "addressLocality": "Paris",
            "postalCode": "75008",
            "addressCountry": "FR"
          },
          "contactPoint": [{
            "@type": "ContactPoint",
            "email": "contact@visustock.com",
            "contactType": "customer support",
            "availableLanguage": ["English", "French"]
          }],
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://visustock.com/#website",
          "url": "https://visustock.com/",
          "name": "VisuStock",
          "publisher": { "@id": "https://visustock.com/#organization" },
          "inLanguage": ["en", "fr"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://visustock.com/marketplace?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "OnlineStore",
          "name": "VisuStock Marketplace",
          "url": "https://visustock.com/marketplace",
          "description": "Buy and sell premium digital downloads: stock photos, videos, audio, ebooks, design assets and AI-generated content.",
          "parentOrganization": { "@id": "https://visustock.com/#organization" }
        }
      ]
    }
    </script>

    <!-- Self-referencing canonical / og:url / twitter:url for non-product routes.
         Product pages are pre-rendered server-side via the og-product Edge Function
         (supabase/functions/og-product) which serves crawler-specific HTML with
         per-product og:title, og:description, og:image, og:type and og:url. -->
    <script>
      (function () {
        try {
          var url = location.origin + location.pathname;
          var setAttr = function (sel, attr, val) {
            var el = document.querySelector(sel);
            if (el) el.setAttribute(attr, val);
          };
          setAttr('link[rel="canonical"]', 'href', url);
          setAttr('meta[property="og:url"]', 'content', url);
          setAttr('meta[name="twitter:url"]', 'content', url);
        } catch (e) {}
      })();
    </script>
  </head>
